<style>
  :root{
    --green:#16967c; --green-dark:#0f7a64; --mint:#dcefe9; --ink:#141414; --text:#333; --muted:#666; --bg:#f4f7f6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:"Inter","Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
       color:var(--text);background:var(--bg);line-height:1.7;-webkit-font-smoothing:antialiased}
  .page{max-width:1000px;margin:32px auto;background:#fff;border-radius:20px;
        box-shadow:0 10px 40px rgba(0,0,0,.06);padding:64px 72px 48px;position:relative}

  /* language toggle */
  .lang{position:fixed;top:16px;right:16px;z-index:10;display:flex;background:#fff;border-radius:999px;
        box-shadow:0 4px 16px rgba(0,0,0,.12);padding:4px}
  .lang button{border:0;background:none;font:600 14px/1 inherit;font-family:inherit;padding:9px 16px;border-radius:999px;
        cursor:pointer;color:var(--muted);transition:.2s}
  .lang button.on{background:var(--green);color:#fff}

  header{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
  .eyebrow{color:var(--green);font-weight:800;font-size:clamp(15px,2.2vw,22px);letter-spacing:.02em}
  h1{font-weight:900;line-height:1.02;margin-top:12px;letter-spacing:-.02em}
  h1 .l1{display:block;color:var(--green);font-size:clamp(48px,10vw,104px)}
  h1 .l2{display:block;color:var(--ink);font-size:clamp(48px,10vw,104px)}
  :lang(zh-Hant) h1{letter-spacing:.02em}
  .logo{width:clamp(88px,15vw,150px);height:auto;flex-shrink:0}

  .meta{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:48px 0 40px}
  .meta div{border-left:3px solid var(--green);padding-left:16px}
  .meta b{display:block;color:var(--green-dark);font-size:18px;font-weight:800}
  .meta span{font-size:14px;color:var(--text)}

  ol.items{list-style:none;position:relative}
  ol.items::before{content:"";position:absolute;left:calc(160px + 28px);top:24px;bottom:24px;width:3px;background:var(--green);border-radius:2px}
  ol.items li{display:grid;grid-template-columns:160px 56px 1fr;align-items:start;padding:10px 0}
  .num{background:var(--mint);border-radius:22px;height:52px;display:flex;align-items:center;justify-content:center;
       font-weight:800;font-size:24px;color:var(--ink)}
  .dot{width:18px;height:18px;border-radius:50%;background:var(--green);margin:17px auto 0;position:relative;z-index:1;
       box-shadow:0 0 0 5px #fff}
  .item h2{font-size:21px;font-weight:800;color:var(--ink);letter-spacing:.01em;margin-top:4px}
  :lang(en) .item h2{text-transform:uppercase}
  .item p{font-size:16px;color:#3a3a3a;margin-top:4px}
  li:hover .num{background:var(--green);color:#fff;transition:.2s}

  footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-top:48px;padding-top:24px;border-top:1px solid #e6ece9;align-items:baseline}
  footer span{font-size:15px;color:var(--text)}
  footer strong{color:var(--green);font-size:20px;font-weight:800;margin-left:10px}
  .note{text-align:center;color:#999;font-size:12px;margin:0 0 32px}

  @media (max-width:720px){
    .page{margin:0;border-radius:0;padding:72px 22px 32px}
    .meta{grid-template-columns:1fr;gap:14px;margin:32px 0 28px}
    ol.items::before{left:calc(64px + 20px)}
    ol.items li{grid-template-columns:64px 40px 1fr}
    .num{height:40px;font-size:18px;border-radius:14px}
    .dot{width:14px;height:14px;margin-top:13px}
    .item h2{font-size:17px}.item p{font-size:15px}
  }
  @media print{
    body{background:#fff}.lang,.note{display:none}
    .page{box-shadow:none;margin:0;padding:24px}
    li{break-inside:avoid}
  }
</style>

function render(l){
  const d = T[l];
  document.documentElement.lang = l === "zh" ? "zh-Hant" : "en";
  document.title = d.title;
  document.querySelectorAll("[data-k]").forEach(el => el.textContent = d[el.dataset.k]);
  document.getElementById("items").innerHTML = d.items.map((it,i) =>
    `<li><div class="num">${String(i+1).padStart(2,"0")}</div><div class="dot"></div>
     <div class="item"><h2></h2><p></p></div></li>`).join("");
  document.querySelectorAll("#items li").forEach((li,i)=>{
    li.querySelector("h2").textContent = d.items[i][0];
    li.querySelector("p").textContent  = d.items[i][1];
  });
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.l === l));
  try{ const u = new URL(location); u.searchParams.set("lang", l); history.replaceState(null, "", u); }catch(e){}
}
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => render(b.dataset.l));
const q = new URLSearchParams(location.search).get("lang");
render(q === "en" || q === "zh" ? q : (navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "en");
</script>
